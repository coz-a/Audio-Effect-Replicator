name: tonetwist-afx
description: 'ToneTwisT AFx dataset, analog (hardware) effects, one knob setting each: dry/wet pairs at 48 kHz / 32-bit float with trainval and test splits. Each archive is extracted into a folder of its own name; the DRY input archive is shared by the subsets.'
license: CC-BY-NC-4.0
citation: 'M. Comunità, C. J. Steinmetz and J. D. Reiss, "Differentiable black-box and gray-box modeling of nonlinear audio effects", Frontiers in Signal Processing, 2025. Dataset: https://github.com/mcomunita/tonetwist-afx-dataset (each subset is a Zenodo record).'
sample_rate: 48000
